name: graphx_connect_nearby
description: Google Nearby Connections transport for graphx_connect on Android and iOS.
repository: https://github.com/roipeker/graphx2-packages
version: 0.1.0-dev.8
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  graphx_connect:
    git:
      url: https://github.com/roipeker/graphx2-packages.git
      path: packages/graphx_connect
      tag_pattern: v{{version}}
    version: ^0.1.0-dev.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.roipeker.graphx_connect
        pluginClass: GraphxConnectPlugin
      ios:
        pluginClass: GraphxConnectPlugin
