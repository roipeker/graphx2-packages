name: graphx_atlas
description: Texture atlas decoding and atlas build helpers for GraphX.
repository: https://github.com/roipeker/graphx2-packages
version: 0.1.0-dev.2
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  graphx:
    git:
      url: https://github.com/roipeker/graphx2.git
      tag_pattern: v{{version}}
    version: ^2.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
